<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MHB SPORTS TV</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f0f0f;
  color:white;
}

header{
  background:#111;
  padding:15px;
  text-align:center;
}

.logo{
  font-size:35px;
  font-weight:bold;
  color:red;
}

.container{
  padding:20px;
}

input{
  width:100%;
  padding:12px;
  margin:5px 0;
  border:none;
  border-radius:8px;
}

button{
  padding:12px;
  border:none;
  border-radius:8px;
  background:red;
  color:white;
  cursor:pointer;
}

.card{
  background:#1d1d1d;
  margin-top:10px;
  padding:15px;
  border-radius:10px;
}

iframe{
  width:100%;
  height:400px;
  border:none;
  border-radius:10px;
  margin-top:10px;
}

h2{
  color:#ff4444;
}
</style>

</head>
<body>

<header>
<div class="logo">MHB SPORTS TV</div>
</header>

<div class="container">



<h2>Channels</h2>

<div id="channelList"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  onValue,
  remove
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyCzCr88t3AdsqI4GobOuZsrncimH-NET28",

authDomain: "mhb-sports-tv-4e594.firebaseapp.com",

databaseURL: "https://mhb-sports-tv-4e594-default-rtdb.firebaseio.com",

projectId: "mhb-sports-tv-4e594",

storageBucket: "mhb-sports-tv-4e594.firebasestorage.app",

messagingSenderId: "32880440056",

appId: "1:32880440056:web:a438ad4ca3cc4a8057010d"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

  window.deleteChannel = function(id){

  if(confirm("Delete this channel?")){

    remove(ref(db,"channels/" + id));

  }

}
window.addChannel = function(){

const name = document.getElementById("channelName").value;

const stream = document.getElementById("streamUrl").value;

if(!name || !stream){
alert("Fill all fields");
return;
}

push(ref(db,"channels"),{

name:name,
stream:stream

});

alert("Channel Added");

document.getElementById("channelName").value="";
document.getElementById("streamUrl").value="";

}

const channelList=document.getElementById("channelList");

onValue(ref(db,"channels"),(snapshot)=>{

channelList.innerHTML="";

snapshot.forEach((child)=>{

const data=child.val();
const key = child.key;

channelList.innerHTML += `
<div class="card">

<h3>${data.name}</h3>

<iframe src="${data.stream}" allowfullscreen></iframe>

<br><br>

<button onclick="deleteChannel('${key}')">
Delete Channel
</button>

</div>
`;

});

});

</script>

</body>
</html>
