<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MHB SPORTS TV</title>
<style>
body{margin:0;background:#0f0f0f;color:white;font-family:Arial}
header{background:#111;padding:15px;text-align:center;position:sticky;top:0}
.logo{font-size:32px;font-weight:bold;color:#ff3b3b}
input{width:90%;max-width:500px;padding:10px;border-radius:8px;border:none}
.menu{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;padding:10px;background:#1a1a1a}
.menu a{color:white;text-decoration:none}
.hero{padding:30px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;padding:20px}
.card{background:#1d1d1d;padding:20px;border-radius:12px;text-align:center}
.player{padding:20px}
iframe{width:100%;height:450px;border:none;border-radius:10px}
footer{text-align:center;padding:20px;background:#111}
</style>
</head>
<body>
<header>
<div class="logo">MHB SPORTS TV</div>
<br>
<input id="search" placeholder="Search channels...">
</header>

<div class="menu">
<a href="#">Home</a>
<a href="#">Live TV</a>
<a href="#">Cricket</a>
<a href="#">Football</a>
<a href="#">Bangla TV</a>
<a href="#">International</a>
</div>

<div class="hero">
<h2>Live Sports & TV Portal</h2>
<p>Add your authorized stream/embed links below.</p>
</div>

<div class="grid">
<div class="card">T Sports</div>
<div class="card">GTV</div>
<div class="card">Star Sports</div>
<div class="card">Sony Sports</div>
<div class="card">Sky Sports</div>
<div class="card">Football TV</div>
</div>

<div class="player">
<h3>Live Player</h3>
<iframe src=""></iframe>
</div>

<footer>
© 2026 MHB SPORTS TV
</footer>
</body>
</html>
